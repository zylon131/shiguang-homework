server {
    listen 80;
    server_name 8.130.50.140;
    location ^~ /.well-known/acme-challenge/ { root /var/www/shiguang-acme; }
    location / { return 308 https://8.130.50.140$request_uri; }
}
server {
    listen 443 ssl;
    server_name 8.130.50.140;
    ssl_certificate /etc/letsencrypt/live/shiguang-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shiguang-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ShiguangSSL:5m;
    ssl_session_timeout 1d;
    client_max_body_size 150M;
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
